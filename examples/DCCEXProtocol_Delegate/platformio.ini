; PlatformIO config for the DCCEXProtocol Basic example
;
; Usage from this folder:
;   pio run
;   pio run -t upload
;   pio device monitor

[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev

; Pick your serial port if auto-detection does not work
; upload_port = /dev/ttyUSB0

monitor_speed = 115200
upload_speed = 921600

; Consume the repository source directory as one local library dependency.
; Referencing src directly avoids recursively treating sibling example
; directories as libraries and compiling unrelated ESP-IDF/native sources.
lib_deps =
	file://../../src
